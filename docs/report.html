<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Build Report — Kumi demo</title><style>:root { --bg:#fdf6e3; --fg:#073642; --muted:#657b83; --line:rgba(7,54,66,.12);
        --ok:#2aa198; --bad:#dc322f; }
* { box-sizing:border-box; margin:0; }
body { font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg);
       padding:2.5rem 1rem; max-width:760px; margin:0 auto; }
.hero h1 { font-size:1.7rem; letter-spacing:-.02em; }
.hero .sub { color:var(--muted); margin:.3rem 0 1.5rem; }
.suite { border:1px solid var(--line); border-radius:10px; margin-bottom:.75rem; overflow:hidden; }
.suite > summary { display:flex; gap:.6rem; align-items:center; padding:.7rem 1rem; cursor:pointer; list-style:none; }
.suite > summary::-webkit-details-marker { display:none; }
.suite[data-status="failed"] > summary { background:color-mix(in srgb,var(--bad) 9%,transparent); }
.name { flex:1; font-weight:600; }
.badge { font-size:.72rem; font-weight:700; text-transform:uppercase; padding:2px 9px; border-radius:999px; }
.badge.ok { color:var(--ok); background:color-mix(in srgb,var(--ok) 16%,transparent); }
.badge.bad { color:var(--bad); background:color-mix(in srgb,var(--bad) 16%,transparent); }
.case { display:flex; gap:.6rem; align-items:center; padding:.45rem 1rem; border-top:1px solid var(--line); font-size:.92rem; }
.case .mark { font-weight:700; color:var(--ok); }
.case.bad .mark { color:var(--bad); }
.case.bad { color:var(--bad); }
.cname { flex:1; }
.ms { color:var(--muted); font-size:.8rem; }</style></head><body><header class="hero"><h1>Build Report</h1><p class="sub">3 suites · 6 tests · built with Kumi</p></header><main><details class="suite" data-status="passed"><summary><span class="name">Lexer</span><span class="badge ok">passing</span></summary><div class="case"><span class="mark">✓</span><span class="cname">tokenizes numbers</span><span class="ms">1ms</span></div><div class="case"><span class="mark">✓</span><span class="cname">handles 0x &amp; 0b literals</span><span class="ms">2ms</span></div></details><details class="suite" data-status="passed"><summary><span class="name">Parser</span><span class="badge ok">passing</span></summary><div class="case"><span class="mark">✓</span><span class="cname">parses precedence</span><span class="ms">3ms</span></div><div class="case"><span class="mark">✓</span><span class="cname">reports a caret at the column</span><span class="ms">2ms</span></div></details><details class="suite" data-status="failed" open><summary><span class="name">Evaluator</span><span class="badge bad">failing</span></summary><div class="case"><span class="mark">✓</span><span class="cname">exact decimal arithmetic</span><span class="ms">5ms</span></div><div class="case bad"><span class="mark">✗</span><span class="cname">tail-call recursion</span><span class="ms">41ms</span></div></details></main></body></html>
